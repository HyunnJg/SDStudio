name: Desktop runtime checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Initialize the desktop file dependency
        run: git submodule update --init externals/capacitor-background-mode
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            release/app/package-lock.json
            src/native/package-lock.json
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - name: Select the pinned npm
        run: npm install --global npm@11.21.3 --ignore-scripts --no-audit --no-fund
      - name: Clean install, Electron download, native build and DLL
        run: npm ci --include=optional --no-audit --no-fund
      - name: Verify the actual Electron/native runtime
        run: npm run verify:desktop
      - name: Configure the Linux Electron sandbox helper
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Development entry and isolated profile
        run: npm run profile:check -- "${{ runner.temp }}/sdstudio-runtime-check" --ozone-platform=headless --disable-gpu
      - name: Download the pinned Electron26 producer (Windows CI fixture only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.erb/scripts/install-legacy-electron-fixture.ps1
      - name: Actual OS async storage compatibility (synthetic tokens only)
        run: npm run test:async-storage:electron
      - name: Unit regressions
        run: npm run test:unit
      - name: Production build
        run: npm run build
      - name: Directory package (no publishing or signing)
        run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged notices
        run: node .erb/scripts/check-package-notices.cjs release/build/${{ runner.os == 'Windows' && 'win-unpacked' || 'linux-unpacked' }}
      - name: Check per-user install and in-place update from the V3 migration baseline
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.erb/scripts/windows-update-check.ps1
